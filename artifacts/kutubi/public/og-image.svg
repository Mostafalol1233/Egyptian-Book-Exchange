<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#0d6b6b"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#heroBg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" opacity="0.03"/>
  <circle cx="1150" cy="550" r="280" fill="white" opacity="0.04"/>
  <circle cx="600" cy="630" r="180" fill="white" opacity="0.03"/>

  <!-- Logo mark -->
  <g transform="translate(120, 200)">
    <rect width="120" height="120" rx="28" fill="white" opacity="0.15"/>
    <!-- Book left page -->
    <path d="M60 22 L20 32 L20 88 L60 78 Z" fill="white" opacity="0.95"/>
    <!-- Book right page -->
    <path d="M60 22 L100 12 L100 72 L60 78 Z" fill="white" opacity="0.75"/>
    <!-- Spine -->
    <rect x="58" y="22" width="4" height="56" rx="2" fill="#0d6b6b" opacity="0.4"/>
    <!-- Lines left -->
    <line x1="30" y1="52" x2="52" y2="56" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="30" y1="62" x2="52" y2="66" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Lines right -->
    <line x1="68" y1="34" x2="90" y2="28" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="68" y1="44" x2="90" y2="38" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Exchange arrows -->
    <path d="M30 104 Q60 116 90 104" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polyline points="85,98 90,104 95,101" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="35,98 30,104 25,101" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main title -->
  <text x="280" y="290" font-family="Cairo, sans-serif" font-size="96" font-weight="800" fill="white" text-anchor="start">كُتُبي</text>

  <!-- Subtitle -->
  <text x="280" y="360" font-family="Cairo, sans-serif" font-size="36" font-weight="500" fill="white" opacity="0.85" text-anchor="start">بيع وشراء الكتب المدرسية في مصر</text>

  <!-- Tagline -->
  <text x="280" y="420" font-family="Cairo, sans-serif" font-size="24" font-weight="400" fill="white" opacity="0.65" text-anchor="start">منصة آمنة لتبادل كتب الثانوية العامة والإعدادية</text>

  <!-- Stats bar -->
  <rect x="280" y="460" width="740" height="80" rx="16" fill="white" opacity="0.1"/>
  <text x="420" y="507" font-family="Cairo, sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle">🆓 مجاني</text>
  <text x="600" y="507" font-family="Cairo, sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle">📚 كل الكتب المدرسية</text>
  <text x="810" y="507" font-family="Cairo, sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle">🏠 جميع المحافظات</text>

  <!-- URL badge -->
  <rect x="120" y="530" width="220" height="44" rx="22" fill="white" opacity="0.15"/>
  <text x="230" y="558" font-family="Cairo, sans-serif" font-size="20" fill="white" text-anchor="middle">books-ex.vercel.app</text>
</svg>
