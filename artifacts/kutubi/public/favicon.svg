<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d6b6b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#shine)"/>

  <!-- Left page of open book -->
  <path d="M50 21 L18 29 L18 67 L50 59 Z" fill="white" opacity="0.95"/>
  <!-- Right page of open book -->
  <path d="M50 21 L82 13 L82 51 L50 59 Z" fill="white" opacity="0.72"/>
  <!-- Book spine line -->
  <line x1="50" y1="21" x2="50" y2="59" stroke="#0a5f5f" stroke-width="1.2" opacity="0.25"/>

  <!-- Text lines — left page -->
  <line x1="26" y1="40" x2="44" y2="43.5" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.32"/>
  <line x1="26" y1="48" x2="44" y2="51.5" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.32"/>
  <line x1="26" y1="56" x2="40" y2="58.5" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.22"/>

  <!-- Text lines — right page -->
  <line x1="58" y1="27" x2="74" y2="23" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.32"/>
  <line x1="58" y1="35" x2="74" y2="31" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.32"/>
  <line x1="58" y1="43" x2="74" y2="39" stroke="#0d6b6b" stroke-width="2.2" stroke-linecap="round" opacity="0.22"/>

  <!-- Exchange arrow arc -->
  <path d="M30 73 Q50 83 70 73" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polyline points="65,68 70,73 75,70" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
