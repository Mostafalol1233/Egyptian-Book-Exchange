<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d6b6b"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- Left book page -->
  <path d="M50 22 L20 30 L20 72 L50 64 Z" fill="white" opacity="0.95"/>
  <!-- Right book page -->
  <path d="M50 22 L80 14 L80 56 L50 64 Z" fill="white" opacity="0.75"/>
  <!-- Book spine -->
  <rect x="48" y="22" width="4" height="42" rx="2" fill="#0d6b6b" opacity="0.4"/>
  <!-- Lines on left page -->
  <line x1="28" y1="43" x2="44" y2="46" stroke="#0d6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="28" y1="51" x2="44" y2="54" stroke="#0d6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Lines on right page -->
  <line x1="56" y1="29" x2="72" y2="25" stroke="#0d6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="56" y1="37" x2="72" y2="33" stroke="#0d6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Exchange arrows at bottom -->
  <path d="M32 78 Q50 87 68 78" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polyline points="63,73 68,78 73,75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="37,73 32,78 27,75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
